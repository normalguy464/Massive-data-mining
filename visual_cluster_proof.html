<!DOCTYPE html>

            background: rgba(255,255,255,0.9); padding: 15px 30px; border: 1px solid #ddd;
            border-radius: 30px; z-index: 100; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
    </style>
</head>

        const edgesData = [{"from": "c_0", "to": "s_196"}, {"from": "c_0", "to": "s_BottomFeedersofYT"}, {"from": "c_0", "to": "s_BleachedEdits"}, {"from": "c_0", "to": "s_AnomalyXd"}, {"from": "c_0", "to": "s_Anime_For_Otakus"}, {"from": "c_0", "to": "s_Animedubs"}, {"from": "c_0", "to": "s_ArcaneAnimatedSeries"}, {"from": "c_0", "to": "s_Billions"}, {"from": "c_0", "to": "s_CourageTheCowardlyDog"}, {"from": "c_0", "to": "s_ASOUE"}, {"from": "c_0", "to": "s_AllTomorrows"}, {"from": "c_0", "to": "s_AdrianoStudies"}, {"from": "c_0", "to": "s_BananaFish"}, {"from": "c_0", "to": "s_12Monkeys"}, {"from": "c_0", "to": "s_CampCamp"}, {"from": "c_0", "to": "s_CaptainAmerica"}, {"from": "c_0", "to": "s_Captain_Marvel"}, {"from": "c_0", "to": "s_CaughtSlipinLive"}, {"from": "c_0", "to": "s_ChurchOfFeMC"}, {"from": "c_0", "to": "s_AmourShipping"}, {"from": "c_29", "to": "s_AccurateBattleSim"}, {"from": "c_29", "to": "s_AgeOfCivilizations"}, {"from": "c_29", "to": "s_ApexConsole"}, {"from": "c_29", "to": "s_BeybladeX"}, {"from": "c_29", "to": "s_BTD5"}, {"from": "c_29", "to": "s_BreakPoint"}, {"from": "c_29", "to": "s_CallOfDutyWorldWarTwo"}, {"from": "c_29", "to": "s_Connery"}, {"from": "c_29", "to": "s_Briggs"}, {"from": "c_29", "to": "s_AliensDarkDescent"}, {"from": "c_29", "to": "s_40kmemes"}, {"from": "c_29", "to": "s_CoreKeeperGame"}, {"from": "c_29", "to": "s_Craftopia_"}, {"from": "c_29", "to": "s_CODZombies"}, {"from": "c_29", "to": "s_ContestOfChampions"}, {"from": "c_29", "to": "s_CallOfDutyBlackOps4"}, {"from": "c_29", "to": "s_BnHAOnesJustice"}, {"from": "c_29", "to": "s_Asfelaeia"}, {"from": "c_29", "to": "s_40k"}, {"from": "c_29", "to": "s_AnimeBattleArena"}];

        function init() {
            const container = document.getElementById('network');
            const data = {
                nodes: new vis.DataSet(nodesData),
                edges: new vis.DataSet(edgesData)
            };

            const options = {
                nodes: {
                    shape: 'dot',
                    font: { size: 14, color: '#000' },
                    borderWidth: 2
                },
                edges: {
                    width: 1.5,
                    color: '#e1e4e8'
                },
                groups: {
                    cluster: { color: { background: '#0066cc', border: '#004a99' }, font: { size: 18, face: 'bold' } },
                    subreddit: { color: { background: '#fff', border: '#ced4da' }, font: { size: 11, color: '#666' } }
                },
                physics: {
                    forceAtlas2Based: {
                        gravitationalConstant: -100,
                        springLength: 100,
                        springConstant: 0.05
                    },
                    solver: 'forceAtlas2Based',
                    stabilization: { iterations: 150 }
                }
            };

            new vis.Network(container, data, options);
        }

        // Chạy ngay khi nạp xong
        window.onload = init;
    </script>
</body>
</html>
